services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: service_job_management
    ports: ["3307:3306"]
    volumes:
      - dbdata:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: service_job_management
      JWT_SECRET: docker_dev_secret_change_me
      JWT_EXPIRES_IN: 1d
      ADMIN_REGISTRATION_KEY: change-me-admin-key
    volumes:
      - uploads:/app/uploads
volumes:
  dbdata:
  uploads:
